name: Bug Report
description: Report a problem with the exporter
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug! Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the problem is.
      placeholder: "When I run … I expect … but instead …"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: CLI command / web action used to reproduce
      description: >
        The exact CLI command you ran, or the steps you took in the web app. Wrap commands in backticks.
      placeholder: |
        ```
        uvx hsl-kaupunkipyora-exporter rides.txt --linear
        ```
    validations:
      required: true

  - type: textarea
    id: sample_input
    attributes:
      label: Sample input
      description: >
        A minimal excerpt from your input that reproduces the problem. Strip personal station names first.
      placeholder: |
        ```
        Departure station: Kaivopuisto
        Departure time: 1.6.2024 14:30
        Return station: Hakaniemi
        Return time: 1.6.2024 14:45
        ```
    validations:
      required: false

  - type: textarea
    id: output
    attributes:
      label: Actual output / error log
      description: Paste the full output or error traceback you received.
      render: text
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python version (CLI) or browser + OS (web app)
      description: >
        Run `python --version` or `uvx hsl-kaupunkipyora-exporter --version`, or state your browser + OS.
      placeholder: "Python 3.12.3  /  Firefox 125 on macOS 14"
    validations:
      required: false

  - type: input
    id: package_version
    attributes:
      label: Package version (CLI only)
      description: |
        Run `uvx hsl-kaupunkipyora-exporter --version` and paste the output.
        Leave blank if you're using the web app.
      placeholder: "0.1.1"
    validations:
      required: false
