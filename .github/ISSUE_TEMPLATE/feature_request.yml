name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please provide as much context as possible.

  - type: textarea
    id: problem
    attributes:
      label: Problem you're trying to solve
      description: >
        Describe the use-case or limitation that motivates this request.
        "I'm frustrated when …" is a great way to start.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature you'd like and how it should work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >
        List any alternative approaches or workarounds you've already tried or thought about.
    validations:
      required: false
