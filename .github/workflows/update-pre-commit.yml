name: Update pre-commit hooks
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # v6
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: true
      # v8.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      # v4
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Update hooks
        run: just update-pre
      - name: Open PR if changed
        run: |
          if git diff --quiet; then
            echo "No hook updates found."
            exit 0
          fi
          BRANCH="chore/pre-commit-autoupdate"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore: update pre-commit hooks"
          git push --force origin "$BRANCH"
          if [ "$(gh pr list --head "$BRANCH" --json number --jq 'length')" = "0" ]; then
            gh pr create --title "chore: update pre-commit hooks" \
              --body "Automated weekly update of pre-commit hook revisions." \
              --head "$BRANCH" --base main
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
