name: Test
permissions:
  contents: read
on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      # v6
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      # v8.1.0 available
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      # v4 available
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      - name: Install stylelint globally
        run: npm install -g stylelint@16 stylelint-config-standard stylelint-config-recommended
      # v2
      - uses: j178/prek-action@cbc2f23eb5539cf20d82d1aabd0d0ecbcc56f4e3
  get-python-versions:
    uses: ./.github/workflows/get-python-versions.yml
  test-code:
    needs: get-python-versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ${{ fromJson(needs.get-python-versions.outputs.python-versions) }}
    steps:
      # v6
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          lfs: true
          persist-credentials: false
      # v8.1.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: ${{ matrix.python-version }}
      # v4
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      - name: Test with pytest
        run: |
          just test ${{ (github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest')
            && '--cov=hsl_kaupunkipyora_exporter --cov-report=html' || '' }}
      - name: Upload coverage report
        if: github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest'
        # v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov
  test-code-result:
    runs-on: ubuntu-latest
    needs: test-code
    if: always()
    steps:
      - name: Check test matrix results
        run: |
          if [[ "${NEEDS_TEST_CODE_RESULT}" == "success" ]]; then
            echo "All test jobs succeeded"
            exit 0
          else
            echo "One or more test jobs failed"
            exit 1
          fi
        env:
          NEEDS_TEST_CODE_RESULT: ${{ needs.test-code.result }}
