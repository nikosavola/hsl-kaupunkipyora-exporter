name: Test
on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v8.1.0 available
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      # v4 available
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      - name: Install stylelint globally
        run: |
          npm install -g --ignore-scripts \
            stylelint@16 \
            stylelint-config-standard@40.0.0 \
            stylelint-config-recommended@18.0.0
      # v2
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece
  get-python-versions:
    permissions:
      contents: read
    uses: ./.github/workflows/get-python-versions.yml
  test-code:
    needs: get-python-versions
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ${{ fromJson(needs.get-python-versions.outputs.python-versions) }}
    steps:
      # v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
          persist-credentials: false
      # v8.1.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: ${{ matrix.python-version }}
      # v4
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      - name: Test with pytest
        run: |
          just test ${{ (github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest')
            && '--cov=hsl_kaupunkipyora_exporter --cov-report=html' || '' }}
      - name: Upload coverage report
        if: github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest'
        # v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov
  web-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v8.1.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Build web app
        run: |
          rm -rf dist web/dist
          uv build --wheel
          mkdir -p web/dist
          cp dist/*.whl web/dist/
          wheel_name=$(basename dist/*.whl)
          printf '{\n  "wheel": "%s"\n}\n' "$wheel_name" > web/dist/manifest.json
          # No Digitransit API key is available in this CI context, so seed
          # the fallback station file the app falls back to on fetch failure
          # with fixture coordinates matching tests/test_data/matkahistoria.txt.
          cp tests/test_data/stations_fixture.json web/dist/stations.json
      - name: Install Playwright browser
        run: uv run --group web-test playwright install --with-deps chromium
      - name: Start local server
        run: |
          cd web && python -m http.server 8000 &
          timeout 10 bash -c 'until curl -sf http://localhost:8000/ > /dev/null; do sleep 0.5; done'
      - name: Run smoke test
        run: uv run --group web-test python tests/web_smoke.py
      - name: Upload log artifact
        if: always()
        # v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: web-smoke-log
          path: web-smoke-log.txt
          if-no-files-found: ignore
  test-code-result:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: test-code
    if: always()
    steps:
      - name: Check test matrix results
        run: |
          if [[ "${NEEDS_TEST_CODE_RESULT}" == "success" ]]; then
            echo "All test jobs succeeded"
            exit 0
          else
            echo "One or more test jobs failed"
            exit 1
          fi
        env:
          NEEDS_TEST_CODE_RESULT: ${{ needs.test-code.result }}
