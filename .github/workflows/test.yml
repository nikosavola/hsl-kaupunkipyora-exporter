name: Test
on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # v6
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      # v8.1.0 available
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      # v4 available
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      - name: Install stylelint globally
        run: |
          npm install -g --ignore-scripts \
            stylelint@16 \
            stylelint-config-standard@40.0.0 \
            stylelint-config-recommended@18.0.0
      # v2
      - uses: j178/prek-action@bdca6f102f98e2b4c7029491a53dfd366469e33d
  get-python-versions:
    permissions:
      contents: read
    uses: ./.github/workflows/get-python-versions.yml
  test-code:
    needs: get-python-versions
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ${{ fromJson(needs.get-python-versions.outputs.python-versions) }}
    steps:
      # v6
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          lfs: true
          persist-credentials: false
      # v8.1.0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          python-version: ${{ matrix.python-version }}
      # v4
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      - name: Test with pytest
        run: |
          just test ${{ (github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest')
            && '--cov=hsl_kaupunkipyora_exporter --cov-report=html' || '' }}
      - name: Upload coverage report
        if: github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest'
        # v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov
  test-code-result:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: test-code
    if: always()
    steps:
      - name: Check test matrix results
        run: |
          if [[ "${NEEDS_TEST_CODE_RESULT}" == "success" ]]; then
            echo "All test jobs succeeded"
            exit 0
          else
            echo "One or more test jobs failed"
            exit 1
          fi
        env:
          NEEDS_TEST_CODE_RESULT: ${{ needs.test-code.result }}
