name: Deploy web app to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "web/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # v6
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      # v4
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Build web assets
        run: just build-web

      # v5
      - uses: actions/configure-pages@983d7736d32e4d813e2f5d49cb48470083653f06
      # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6ccd46c0ca2d9
        with:
          path: web

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # v5
      - id: deployment
        uses: actions/deploy-pages@cd2ce8f367203868f35336918739d69c4b32eeef
