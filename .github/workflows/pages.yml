name: Deploy web app to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # v6
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Build wheel and stage into web/dist
        run: |
          rm -rf dist web/dist
          uv build --wheel
          mkdir -p web/dist
          cp dist/*.whl web/dist/
          wheel_name=$(basename dist/*.whl)
          printf '{\n  "wheel": "%s"\n}\n' "$wheel_name" > web/dist/manifest.json
          cat web/dist/manifest.json

      # v5
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: web
      # v4
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac2b3c603fc
