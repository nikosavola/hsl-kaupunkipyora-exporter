[project]
name = "hsl-kaupunkipyora-exporter"
version = "0.1.1"
description = "Parse HSL City Bike ride history and export rides as GPX or TCX files for Strava"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "Niko Savola" }]
keywords = [
  "citybike",
  "cycling",
  "fitness",
  "gpx",
  "helsinki",
  "hsl",
  "kaupunkipyora",
  "strava",
  "tcx",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Utilities",
]
dependencies = [
  "beautifulsoup4>=4.13",
  "gpxpy>=1.6",
  "haversine>=2.9.0",
  "polyline>=2.0.4",
]

[project.urls]
Changelog = "https://github.com/nikosavola/hsl-kaupunkipyora-exporter/releases"
Issues = "https://github.com/nikosavola/hsl-kaupunkipyora-exporter/issues"
Repository = "https://github.com/nikosavola/hsl-kaupunkipyora-exporter"

[project.scripts]
hsl-kaupunkipyora-exporter = "hsl_kaupunkipyora_exporter.cli:main"

[dependency-groups]
dev = [{ include-group = "lint" }, { include-group = "test" }]
lint = ["prek"]
test = [
  "hypothesis",
  "pytest>=9.0.0",
  "pytest-cov",
  "pytest-xdist",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.codespell]
ignore-words-list = "astroid,alle,som,Vie"
skip = "uv.lock"

[tool.interrogate]
docstring-style = "google"
exclude = ["tests", "src/hsl_kaupunkipyora_exporter/**/__init__.py"]
ext = []
fail-under = 100
ignore-nested-classes = true
ignore-nested-functions = true
ignore-regex = ["^test_.*"]
omit-covered-files = true
verbose = 2

[tool.pyrefly]
project-excludes = ["**/__pycache__", "**/.*", "docs/**", ".venv/**"]
project-includes = ["**/*.py"]

[tool.pyrefly.errors]
no-matching-overload = "ignore"

[tool.pytest]
addopts = ["--tb=short"]
python_files = ["hsl_kaupunkipyora_exporter/*.py", "test_*.py"]
testpaths = ["src/hsl_kaupunkipyora_exporter/", "tests/"]

[tool.ruff]
fix = true
preview = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
ignore = [
  "B008",
  "C901",
  "B905",
  "RUF001",
  "RUF003",
  "RUF067",
  "ERA001",
  "E501"
]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "C4",  # flake8-comprehensions
  "B",  # flake8-bugbear
  "D",  # pydocstyle
  "UP",  # pyupgrade
  "T10",  # flake8-debugger
  "S",  # flake8-bandit
  "PT",  # flake8-pytest-style
  "SIM",  # flake8-simplify
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "Q",  # flake8-quotes
  "SLOT",  # flake8-slots
  "ARG",  # flake8-unused-arguments
  "PTH",  # flake8-use-pathlib
  "PD",  # pandas-vet
  "FLY",  # flynt
  "NPY",  # numpy
  "PERF",  # perflint
  "RUF",  # ruff
  "PL",  # pylint
  "N",  # pep8-naming
  "A",  # flake8-builtins
  "TRY",  # tryceratops
  "T20",  # flake8-print
  "ISC",  # flake8-implicit-str-concat
  "ERA",  # eradicate
  "FURB",  # refurb
  "DOC",  # pydoclint
  "ASYNC",  # flake8-async
  "TID",  # flake8-tidy-imports
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/test_*.py" = ["S101", "D102", "D103", "PLC2701", "PLR6301", "ARG002"]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-decorators = ["typing.overload"]

[tool.ruff.lint.pydoclint]
ignore-one-line-docstrings = true

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.tombi.schema]
strict = false

[tool.uv]
default-groups = ["dev", "lint", "test"]

[tool.uv.build-backend]
module-root = "src"
source-exclude = ["test_*.py", "tests/**"]
